<title id="launch-t">Launch timeline</title><desc id="launch-d">Work runs from eight weeks before launch to four weeks after: plan and messaging first, then campaign and design, content and sales material, PR and promotion, a readiness review one week before, and an evaluation four weeks after.</desc>

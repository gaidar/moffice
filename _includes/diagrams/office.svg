<svg class="dg" viewBox="0 0 980 330" role="img" aria-labelledby="office-t office-d" xmlns="http://www.w3.org/2000/svg">
<title id="office-t">How the office works</title><desc id="office-d">The office manual, context pack and your task go to an agent role. It runs a skill, which produces a draft. The marketing reviewer critiques the draft, and you decide. New facts go back into the context pack.</desc>
<defs><marker id="office-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="dg-box " x="20" y="30" width="190" height="62" rx="5"/>
<text class="dg-t " x="115.0" y="58.5" text-anchor="middle">Office manual</text>
<text class="dg-s " x="115.0" y="74.5" text-anchor="middle">rules for every chat</text>
<rect class="dg-box " x="20" y="110" width="190" height="62" rx="5"/>
<text class="dg-t " x="115.0" y="138.5" text-anchor="middle">Context pack</text>
<text class="dg-s " x="115.0" y="154.5" text-anchor="middle">10 files of company facts</text>
<rect class="dg-box " x="20" y="190" width="190" height="62" rx="5"/>
<text class="dg-t " x="115.0" y="218.5" text-anchor="middle">Your task</text>
<text class="dg-s " x="115.0" y="234.5" text-anchor="middle">one prompt you paste</text>
<rect class="dg-box " x="280" y="110" width="150" height="62" rx="5"/>
<text class="dg-t " x="355.0" y="138.5" text-anchor="middle">Agent role</text>
<text class="dg-s " x="355.0" y="154.5" text-anchor="middle">owns the job</text>
<rect class="dg-box soft" x="280" y="20" width="150" height="62" rx="5"/>
<text class="dg-t soft" x="355.0" y="48.5" text-anchor="middle">Skill</text>
<text class="dg-s soft" x="355.0" y="64.5" text-anchor="middle">steps and fixed format</text>
<rect class="dg-box " x="500" y="110" width="130" height="62" rx="5"/>
<text class="dg-t " x="565.0" y="138.5" text-anchor="middle">Draft</text>
<text class="dg-s " x="565.0" y="154.5" text-anchor="middle">with its assumptions</text>
<rect class="dg-box " x="680" y="110" width="130" height="62" rx="5"/>
<text class="dg-t " x="745.0" y="138.5" text-anchor="middle">Reviewer</text>
<text class="dg-s " x="745.0" y="154.5" text-anchor="middle">critiques, optional</text>
<rect class="dg-box accent" x="850" y="110" width="110" height="62" rx="5"/>
<text class="dg-t accent" x="905.0" y="145.5" text-anchor="middle">You decide</text>
<path class="dg-arrow" d="M210 61 L280 132" marker-end="url(#office-a)"/>
<path class="dg-arrow" d="M210 141 L280 141" marker-end="url(#office-a)"/>
<path class="dg-arrow" d="M210 221 L280 152" marker-end="url(#office-a)"/>
<path class="dg-arrow" d="M355 82 L355 110" marker-end="url(#office-a)"/>
<path class="dg-arrow" d="M430 141 L500 141" marker-end="url(#office-a)"/>
<path class="dg-arrow" d="M630 141 L680 141" marker-end="url(#office-a)"/>
<path class="dg-arrow" d="M810 141 L850 141" marker-end="url(#office-a)"/>
<path class="dg-arrow dash" d="M905 172 L905 298 L115 298 L115 252" marker-end="url(#office-a)"/>
<text class="dg-s" x="510" y="290" text-anchor="middle">New facts and decisions go back into the context pack</text>
</svg>

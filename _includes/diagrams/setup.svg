<svg class="dg" viewBox="0 0 980 330" role="img" aria-labelledby="setup-t setup-d" xmlns="http://www.w3.org/2000/svg">
<title id="setup-t">What the setup looks like</title><desc id="setup-d">A project holds the office manual in its instructions and the context pack, skills and charters as files. Each chat inside it starts ready. The plain-chat fallback repeats a paste and an upload at the start of each chat.</desc>
<defs><marker id="setup-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="dg-frame" x="14" y="14" width="952" height="170" rx="7"/>
<text class="dg-l" x="26" y="32">With a project or notebook: set up once</text>
<rect class="dg-box soft" x="34" y="48" width="220" height="56" rx="5"/>
<text class="dg-t soft" x="144.0" y="73.5" text-anchor="middle">Persistent instructions</text>
<text class="dg-s soft" x="144.0" y="89.5" text-anchor="middle">the office manual</text>
<rect class="dg-box soft" x="34" y="114" width="220" height="56" rx="5"/>
<text class="dg-t soft" x="144.0" y="139.5" text-anchor="middle">3 files</text>
<text class="dg-s soft" x="144.0" y="155.5" text-anchor="middle">your pack, all skills, all charters</text>
<rect class="dg-box " x="330" y="80" width="200" height="60" rx="5"/>
<text class="dg-t " x="430.0" y="107.5" text-anchor="middle">New chat in the project</text>
<text class="dg-s " x="430.0" y="123.5" text-anchor="middle">starts ready</text>
<rect class="dg-box " x="590" y="80" width="160" height="60" rx="5"/>
<text class="dg-t " x="670.0" y="114.5" text-anchor="middle">Paste one prompt</text>
<rect class="dg-box accent" x="810" y="80" width="136" height="60" rx="5"/>
<text class="dg-t accent" x="878.0" y="114.5" text-anchor="middle">Draft</text>
<path class="dg-arrow" d="M254 76 L330 100" marker-end="url(#setup-a)"/>
<path class="dg-arrow" d="M254 142 L330 120" marker-end="url(#setup-a)"/>
<path class="dg-arrow" d="M530 110 L590 110" marker-end="url(#setup-a)"/>
<path class="dg-arrow" d="M750 110 L810 110" marker-end="url(#setup-a)"/>
<rect class="dg-frame" x="14" y="202" width="952" height="116" rx="7"/>
<text class="dg-l" x="26" y="220">Plain-chat fallback: chat and file upload only, repeated for each chat</text>
<rect class="dg-box " x="34" y="240" width="180" height="60" rx="5"/>
<text class="dg-t " x="124.0" y="274.5" text-anchor="middle">Paste the office manual</text>
<rect class="dg-box " x="250" y="240" width="180" height="60" rx="5"/>
<text class="dg-t " x="340.0" y="274.5" text-anchor="middle">Upload files you need</text>
<rect class="dg-box " x="466" y="240" width="150" height="60" rx="5"/>
<text class="dg-t " x="541.0" y="274.5" text-anchor="middle">Paste one prompt</text>
<rect class="dg-box accent" x="652" y="240" width="120" height="60" rx="5"/>
<text class="dg-t accent" x="712.0" y="274.5" text-anchor="middle">Draft</text>
<rect class="dg-box " x="808" y="240" width="138" height="60" rx="5"/>
<text class="dg-t " x="877.0" y="274.5" text-anchor="middle">Save it yourself</text>
<path class="dg-arrow" d="M214 270 L250 270" marker-end="url(#setup-a)"/>
<path class="dg-arrow" d="M430 270 L466 270" marker-end="url(#setup-a)"/>
<path class="dg-arrow" d="M616 270 L652 270" marker-end="url(#setup-a)"/>
<path class="dg-arrow" d="M772 270 L808 270" marker-end="url(#setup-a)"/>
</svg>
